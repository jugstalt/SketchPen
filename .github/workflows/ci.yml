name: CI

# Builds and tests on every push to main and on every pull request, so a broken build,
# a failing test, or a TypeScript error in the VS Code extension shows up before a release
# tag is cut (release.yml only runs on version tags).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep going when one platform fails, so it is visible whether a failure is
      # platform-specific (e.g. SkiaSharp native assets) or general.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build SketchPen.sln -c Release

      - name: Test
        # Unit tests plus golden-render tests (tests/SketchPen.Tests/Golden). If an intended
        # rendering change fails them: UPDATE_GOLDEN=1 dotnet test, and review the SVG diff.
        run: dotnet test tests/SketchPen.Tests/SketchPen.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

  extension:
    name: VS Code extension (compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile
