name: Release

# Builds and publishes the SketchPen.Cli .NET global tool whenever a version
# tag (vX.Y.Z) is pushed. Requires a NUGET_API_KEY repository secret (Settings
# -> Secrets and variables -> Actions), scoped to push the SketchPen.Cli
# package on nuget.org -- create it yourself, this workflow does not create it.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          # Remove once .NET 10 has a stable release available to setup-dotnet.
          dotnet-quality: "preview"

      - name: Derive package version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore src/SketchPen/SketchPen.csproj

      - name: Pack SketchPen.Cli
        # `dotnet pack` builds implicitly; only src/SketchPen and its own
        # ProjectReferences (SketchPen.Compose/Plot/Plot.Skia/Plot.Drawing) are
        # touched here -- the SketchPen.Code web app is intentionally not
        # built as part of this release.
        run: >
          dotnet pack src/SketchPen/SketchPen.csproj
          -c Release
          -p:Version=${{ env.VERSION }}
          -o ./artifacts

      - name: Push to NuGet.org
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./artifacts/*.nupkg
